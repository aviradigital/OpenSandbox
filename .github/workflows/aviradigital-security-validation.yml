name: Aviradigital Security Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-dependency-scan:
    name: License & Dependency Scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Install Syft
      # --------------------------------------------------
      - name: Install Syft
        run: |
          set -e

          echo "Installing Syft..."

          curl -sSfL https://get.anchore.io/syft \
            | sh -s -- -b /usr/local/bin

          echo "Syft version:"
          syft version

      # --------------------------------------------------
      # 3. Generate SBOM and license inventory
      # --------------------------------------------------
      - name: Generate SBOM and license inventory
        run: |
          set -e

          echo "Starting OpenSandbox dependency and license scan..."

          syft scan dir:. \
            --enrich javascript,python \
            -o syft-json=license-report.json

          echo "License/dependency scan completed."

          echo "Generated report:"
          ls -lh license-report.json

      # --------------------------------------------------
      # 4. Show license summary
      # --------------------------------------------------
      - name: Show scan summary
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter

          REPORT = "license-report.json"

          with open(REPORT, "r", encoding="utf-8") as f:
              data = json.load(f)

          artifacts = data.get("artifacts", [])

          license_records = []
          license_counts = Counter()

          for artifact in artifacts:

              artifact_name = artifact.get("name", "UNKNOWN")
              artifact_version = artifact.get("version", "UNKNOWN")
              artifact_type = artifact.get("type", "UNKNOWN")

              licenses = artifact.get("licenses") or []

              for license_info in licenses:

                  if isinstance(license_info, dict):

                      license_value = (
                          license_info.get("spdxExpression")
                          or license_info.get("value")
                          or "UNKNOWN"
                      )

                  else:
                      license_value = str(license_info)

                  license_records.append(
                      {
                          "package": artifact_name,
                          "version": artifact_version,
                          "type": artifact_type,
                          "license": license_value,
                      }
                  )

                  license_counts[license_value] += 1

          print("")
          print("==============================================")
          print("       OpenSandbox License Scan")
          print("==============================================")
          print(f"Artifacts detected : {len(artifacts)}")
          print(f"License records    : {len(license_records)}")
          print("----------------------------------------------")
          print("License summary")
          print("----------------------------------------------")

          if license_counts:

              for license_name, count in license_counts.most_common():
                  print(f"{license_name}: {count}")

          else:
              print("No license records detected.")

          print("==============================================")
          PY

      # --------------------------------------------------
      # 5. Run license policy check
      # --------------------------------------------------
      - name: Run license policy check
        run: |
          set -e

          echo "Running license policy check..."

          python3 .github/scripts/policy_check.py

      # --------------------------------------------------
      # 6. Upload Syft license report
      # --------------------------------------------------
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensandbox-license-report
          path: license-report.json
          retention-days: 7

      # --------------------------------------------------
      # 7. Upload license policy report
      # --------------------------------------------------
      - name: Upload license policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensandbox-license-policy-report
          path: license-policy-report.json
          retention-days: 7
