name: Aviradigital Security Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-dependency-scan:
    name: License & Dependency Scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Install Syft
      # --------------------------------------------------
      - name: Install Syft
        run: |
          set -e

          echo "Installing Syft..."

          curl -sSfL https://get.anchore.io/syft \
            | sh -s -- -b /usr/local/bin

          echo "Syft version:"
          syft version

      # --------------------------------------------------
      # 3. Generate SBOM and license inventory
      # --------------------------------------------------
      - name: Generate SBOM and license inventory
        run: |
          set -e

          echo "Starting OpenSandbox dependency and license scan..."

          syft scan dir:. \
            --enrich javascript,python \
            -o syft-json=license-report.json

          echo "License/dependency scan completed."

          echo "Generated report:"
          ls -lh license-report.json

      # --------------------------------------------------
      # 4. Show license summary
      # --------------------------------------------------
      - name: Show scan summary
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter

          REPORT = "license-report.json"

          with open(REPORT, "r", encoding="utf-8") as f:
              data = json.load(f)

          artifacts = data.get("artifacts", [])

          license_records = []
          license_counts = Counter()

          for artifact in artifacts:

              artifact_name = artifact.get("name", "UNKNOWN")
              artifact_version = artifact.get("version", "UNKNOWN")
              artifact_type = artifact.get("type", "UNKNOWN")

              licenses = artifact.get("licenses") or []

              for license_info in licenses:

                  if isinstance(license_info, dict):

                      license_value = (
                          license_info.get("spdxExpression")
                          or license_info.get("value")
                          or "UNKNOWN"
                      )

                  else:
                      license_value = str(license_info)

                  license_records.append(
                      {
                          "package": artifact_name,
                          "version": artifact_version,
                          "type": artifact_type,
                          "license": license_value,
                      }
                  )

                  license_counts[license_value] += 1

          print("")
          print("==============================================")
          print("       OpenSandbox License Scan")
          print("==============================================")
          print(f"Artifacts detected : {len(artifacts)}")
          print(f"License records    : {len(license_records)}")
          print("----------------------------------------------")
          print("License summary")
          print("----------------------------------------------")

          if license_counts:

              for license_name, count in license_counts.most_common():
                  print(f"{license_name}: {count}")

          else:
              print("No license records detected.")

          print("==============================================")
          PY

      # --------------------------------------------------
      # 5. Run license policy check
      # --------------------------------------------------
      - name: Run license policy check
        run: |
          set -e

          echo "Running license policy check..."

          python3 .github/scripts/policy_check.py

      # --------------------------------------------------
      # 6. Upload Syft license report
      # --------------------------------------------------
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensandbox-license-report
          path: license-report.json
          retention-days: 7

      # --------------------------------------------------
      # 7. Upload license policy report
      # --------------------------------------------------
      - name: Upload license policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensandbox-license-policy-report
          path: license-policy-report.json
          retention-days: 7

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Trivy
        run: |
          set -e

          echo "Installing Trivy..."

          sudo apt-get update
          sudo apt-get install -y wget

          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          echo "Trivy version:"
          trivy --version

      - name: Run filesystem vulnerability scan
        run: |
          set +e

          echo "Starting OpenSandbox vulnerability scan..."

          trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-vulnerability-report.json

          TRIVY_EXIT_CODE=$?

          echo "Trivy exit code: ${TRIVY_EXIT_CODE}"

          if [ -f trivy-vulnerability-report.json ]; then
            echo "Vulnerability report generated:"
            ls -lh trivy-vulnerability-report.json
          fi

          # Report-only for MVP.
          # Vulnerabilities will NOT block the pipeline yet.
          exit 0

      - name: Show vulnerability summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter

          report = "trivy-vulnerability-report.json"

          try:
              with open(report, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except FileNotFoundError:
              print("No Trivy report found.")
              raise SystemExit(0)

          severity_counts = Counter()
          vulnerability_count = 0

          for result in data.get("Results", []):
              for vulnerability in result.get("Vulnerabilities") or []:
                  vulnerability_count += 1
                  severity = vulnerability.get("Severity", "UNKNOWN")
                  severity_counts[severity] += 1

          print("")
          print("==============================================")
          print("     OpenSandbox Vulnerability Summary")
          print("==============================================")
          print(f"Total vulnerabilities : {vulnerability_count}")
          print(f"CRITICAL              : {severity_counts['CRITICAL']}")
          print(f"HIGH                  : {severity_counts['HIGH']}")
          print(f"MEDIUM                : {severity_counts['MEDIUM']}")
          print(f"LOW                   : {severity_counts['LOW']}")
          print(f"UNKNOWN               : {severity_counts['UNKNOWN']}")
          print("==============================================")

          print("")
          print("Top vulnerability findings:")
          print("----------------------------------------------")

          shown = 0

          for result in data.get("Results", []):
              target = result.get("Target", "UNKNOWN")

              for vulnerability in result.get("Vulnerabilities") or []:
                  vuln_id = vulnerability.get("VulnerabilityID", "UNKNOWN")
                  severity = vulnerability.get("Severity", "UNKNOWN")
                  package = vulnerability.get("PkgName", "UNKNOWN")
                  installed = vulnerability.get("InstalledVersion", "UNKNOWN")
                  fixed = vulnerability.get("FixedVersion", "Not available")

                  print(
                      f"{severity:8} "
                      f"{vuln_id:20} "
                      f"{package} "
                      f"{installed} "
                      f"-> {fixed} "
                      f"[{target}]"
                  )

                  shown += 1

                  if shown >= 50:
                      print("... showing first 50 findings")
                      raise SystemExit(0)
          PY

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensandbox-vulnerability-report
          path: trivy-vulnerability-report.json
          retention-days: 7

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

          TRIVY_VERSION="0.74.0"

          wget -q \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          sudo mv trivy /usr/local/bin/trivy

          trivy --version

      - name: Run secrets scan
        run: |
          set -e

          trivy fs . \
            --scanners secret \
            --format json \
            --output trivy-secret-raw.json \
            --exit-code 0

      - name: Create sanitized secrets report
        run: |
          python3 <<'PY'
          import json
          from collections import Counter

          input_file = "trivy-secret-raw.json"
          output_file = "secret-scan-report.json"

          with open(input_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          findings = []

          for result in data.get("Results", []):
              target = result.get("Target", "")

              for secret in result.get("Secrets", []) or []:
                  findings.append({
                      "rule_id": secret.get("RuleID"),
                      "category": secret.get("Category"),
                      "severity": secret.get("Severity"),
                      "title": secret.get("Title"),
                      "target": target,
                      "start_line": secret.get("StartLine"),
                      "end_line": secret.get("EndLine")
                  })

          severity_counts = Counter(
              item.get("severity") or "UNKNOWN"
              for item in findings
          )

          report = {
              "summary": {
                  "total_findings": len(findings),
                  "critical": severity_counts.get("CRITICAL", 0),
                  "high": severity_counts.get("HIGH", 0),
                  "medium": severity_counts.get("MEDIUM", 0),
                  "low": severity_counts.get("LOW", 0),
                  "unknown": severity_counts.get("UNKNOWN", 0)
              },
              "findings": findings
          }

          with open(output_file, "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)

          print("Secrets scan summary")
          print("====================")
          print(f"Total findings : {len(findings)}")
          print(f"Critical       : {severity_counts.get('CRITICAL', 0)}")
          print(f"High           : {severity_counts.get('HIGH', 0)}")
          print(f"Medium         : {severity_counts.get('MEDIUM', 0)}")
          print(f"Low            : {severity_counts.get('LOW', 0)}")
          print(f"Unknown        : {severity_counts.get('UNKNOWN', 0)}")

          if findings:
              print("")
              print("Potential secrets detected:")
              for item in findings:
                  print(
                      f"- {item['rule_id']} | "
                      f"{item['severity']} | "
                      f"{item['target']} | "
                      f"line {item['start_line']}"
                  )
          else:
              print("")
              print("No secrets detected.")
          PY

          # Never retain the raw report because it may contain
          # the actual secret value.
          rm -f trivy-secret-raw.json

      - name: Upload sanitized secrets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-report
          path: secret-scan-report.json
          if-no-files-found: warn          

  sast-scan:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - go
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"          

  suspicious-code-binary-scan:
    name: Suspicious Code and Binary Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository
        shell: bash
        run: |
          set +e

          mkdir -p security-inspection

          echo "========================================"
          echo "Suspicious Code / Binary Inspection"
          echo "========================================"

          echo ""
          echo "1. Potential remote-code execution patterns"
          echo "--------------------------------------------"

          rg -n -i \
            --hidden \
            --glob '!.git/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/.venv/**' \
            --glob '!**/venv/**' \
            --glob '!**/__pycache__/**' \
            --glob '!**/dist/**' \
            --glob '!**/build/**' \
            'curl[[:space:]].*\|[[:space:]]*(sh|bash)|wget[[:space:]].*\|[[:space:]]*(sh|bash)|curl[[:space:]].*-o.*&&.*(sh|bash)|wget[[:space:]].*-O.*&&.*(sh|bash)' \
            . \
            > security-inspection/remote-execution.txt

          echo ""
          echo "2. Potential dynamic execution patterns"
          echo "---------------------------------------"

          rg -n \
            --hidden \
            --glob '!.git/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/.venv/**' \
            --glob '!**/venv/**' \
            --glob '!**/__pycache__/**' \
            'eval[[:space:]]*\(|exec[[:space:]]*\(|os\.system[[:space:]]*\(|subprocess\..*shell[[:space:]]*=[[:space:]]*True' \
            . \
            > security-inspection/dynamic-execution.txt

          echo ""
          echo "3. Potential encoded/obfuscated execution"
          echo "-----------------------------------------"

          rg -n -i \
            --hidden \
            --glob '!.git/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/.venv/**' \
            --glob '!**/venv/**' \
            --glob '!**/__pycache__/**' \
            'base64[[:space:]]+(-d|--decode)|frombase64string|atob[[:space:]]*\(' \
            . \
            > security-inspection/encoded-execution.txt

          echo ""
          echo "4. Potential permission manipulation"
          echo "------------------------------------"

          rg -n \
            --hidden \
            --glob '!.git/**' \
            --glob '!**/node_modules/**' \
            'chmod[[:space:]]+\+x|chmod[[:space:]]+777|install[[:space:]]+-m[[:space:]]+777' \
            . \
            > security-inspection/permission-changes.txt

          echo ""
          echo "5. External download patterns"
          echo "-----------------------------"

          rg -n -i \
            --hidden \
            --glob '!.git/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/.venv/**' \
            --glob '!**/venv/**' \
            'https?://|requests\.(get|post)|urllib\.request|httpx\.(get|post)|wget[[:space:]]|curl[[:space:]]' \
            . \
            > security-inspection/external-downloads.txt

          echo ""
          echo "6. Executable / binary inventory"
          echo "--------------------------------"

          find . \
            -path './.git' -prune -o \
            -path '*/node_modules' -prune -o \
            -path '*/.venv' -prune -o \
            -path '*/venv' -prune -o \
            -type f -print0 |
          while IFS= read -r -d '' file; do
            file "$file"
          done |
          grep -E 'ELF|Mach-O|PE32|executable' \
            > security-inspection/binaries.txt

          echo ""
          echo "7. Git-tracked executable files"
          echo "--------------------------------"

          git ls-files -s |
            awk '$1 ~ /^100755$/ {print $4}' \
            > security-inspection/tracked-executables.txt

          echo ""
          echo "Inspection completed."
          echo "All findings are report-only."
          echo ""

          for f in security-inspection/*.txt; do
            echo "===== $f ====="
            if [ -s "$f" ]; then
              cat "$f"
            else
              echo "No findings"
            fi
            echo ""
          done

      - name: Generate inspection summary
        if: always()
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          base = Path("security-inspection")

          files = {
              "remote_execution": "remote-execution.txt",
              "dynamic_execution": "dynamic-execution.txt",
              "encoded_execution": "encoded-execution.txt",
              "permission_changes": "permission-changes.txt",
              "external_downloads": "external-downloads.txt",
              "binaries": "binaries.txt",
              "tracked_executables": "tracked-executables.txt",
          }

          report = {}

          for name, filename in files.items():
              path = base / filename

              if path.exists():
                  lines = [
                      line.strip()
                      for line in path.read_text(
                          encoding="utf-8",
                          errors="replace"
                      ).splitlines()
                      if line.strip()
                  ]
              else:
                  lines = []

              report[name] = {
                  "count": len(lines),
                  "findings": lines
              }

          total = sum(
              item["count"]
              for item in report.values()
          )

          output = {
              "summary": {
                  "total_indicators": total
              },
              "checks": report
          }

          with open(
              base / "suspicious-code-binary-report.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(output, f, indent=2)

          print("Suspicious Code / Binary Summary")
          print("================================")
          print(f"Total indicators: {total}")

          for name, item in report.items():
              print(f"{name}: {item['count']}")
          PY

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suspicious-code-binary-report
          path: security-inspection/
          if-no-files-found: warn          

  dockerfile-security-scan:
    name: Dockerfile Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -e

          TRIVY_VERSION="0.74.0"

          wget -q \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          sudo mv trivy /usr/local/bin/trivy

          trivy --version

      - name: Scan Dockerfiles
        run: |
          set +e

          mkdir -p docker-security

          trivy config . \
            --severity HIGH,CRITICAL \
            --format json \
            --output dockerfile-trivy-report.json \
            --exit-code 0

          echo ""
          echo "Dockerfile scan completed."

          python3 <<'PY'
          import json

          with open("dockerfile-trivy-report.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          findings = []

          for result in data.get("Results", []):
              target = result.get("Target", "")

              for misconfig in result.get("Misconfigurations", []) or []:
                  findings.append({
                      "id": misconfig.get("ID"),
                      "severity": misconfig.get("Severity"),
                      "title": misconfig.get("Title"),
                      "target": target,
                      "primary_url": misconfig.get("PrimaryURL"),
                  })

          report = {
              "summary": {
                  "total_findings": len(findings)
              },
              "findings": findings
          }

          with open(
              "docker-security/dockerfile-security-report.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(report, f, indent=2)

          print("")
          print("Dockerfile Security Summary")
          print("============================")
          print(f"Total HIGH/CRITICAL findings: {len(findings)}")

          for item in findings:
              print(
                  f"- {item['id']} | "
                  f"{item['severity']} | "
                  f"{item['target']} | "
                  f"{item['title']}"
              )
          PY

          rm -f dockerfile-trivy-report.json

      - name: Upload Dockerfile security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockerfile-security-report
          path: docker-security/
          if-no-files-found: warn          

  docker-image-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OpenSandbox server image
        run: |
          set -e

          docker build \
            --file server/Dockerfile \
            --tag opensandbox-server:security-validation \
            server

      - name: Install Trivy
        run: |
          set -e

          TRIVY_VERSION="0.74.0"

          wget -q \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          sudo mv trivy /usr/local/bin/trivy

          trivy --version

      - name: Scan Docker image
        run: |
          set +e

          mkdir -p docker-image-security

          trivy image \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-image-raw.json \
            --exit-code 0 \
            opensandbox-server:security-validation

          python3 <<'PY'
          import json
          from collections import Counter

          with open("trivy-image-raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          findings = []

          for result in data.get("Results", []):
              target = result.get("Target", "")

              for vuln in result.get("Vulnerabilities", []) or []:
                  findings.append({
                      "vulnerability_id": vuln.get("VulnerabilityID"),
                      "severity": vuln.get("Severity"),
                      "package": vuln.get("PkgName"),
                      "installed_version": vuln.get("InstalledVersion"),
                      "fixed_version": vuln.get("FixedVersion"),
                      "target": target,
                      "title": vuln.get("Title")
                  })

          counts = Counter(
              finding.get("severity") or "UNKNOWN"
              for finding in findings
          )

          report = {
              "image": "opensandbox-server:security-validation",
              "summary": {
                  "total_findings": len(findings),
                  "critical": counts.get("CRITICAL", 0),
                  "high": counts.get("HIGH", 0)
              },
              "findings": findings
          }

          with open(
              "docker-image-security/docker-image-security-report.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(report, f, indent=2)

          print("")
          print("========================================")
          print("Docker Image Security Summary")
          print("========================================")
          print(f"Total HIGH/CRITICAL : {len(findings)}")
          print(f"CRITICAL           : {counts.get('CRITICAL', 0)}")
          print(f"HIGH               : {counts.get('HIGH', 0)}")

          for finding in findings:
              print(
                  f"- {finding['vulnerability_id']} | "
                  f"{finding['severity']} | "
                  f"{finding['package']} | "
                  f"{finding['installed_version']} -> "
                  f"{finding['fixed_version'] or 'no fixed version'}"
              )
          PY

          rm -f trivy-image-raw.json

      - name: Upload Docker image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-security-report
          path: docker-image-security/
          if-no-files-found: warn
